name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk koe-rewrite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: koe-rewrite
          path: koe-rewrite.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: koe-v${{ github.run_number }}
          name: こえリライト v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: koe-rewrite.apk
